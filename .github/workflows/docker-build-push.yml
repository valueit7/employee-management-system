name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to GitHub Package Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Build Docker Images
        run: |
          docker buildx -t ghcr.io/${{ github.repository }}/spring-app:latest ./emp_backend
          docker buildx -t ghcr.io/${{ github.repository }}/angular-app:latest ./employee frontend final

      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository }}/spring-app:latest
          docker push ghcr.io/${{ github.repository }}/angular-app:latest
